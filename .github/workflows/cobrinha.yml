name: Atualizar Galaga

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cobrinha.yml"

permissions:
  contents: write

concurrency:
  group: galaga-contribution-graph
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Gerar Galaga
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: GustavoFelip
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: galaga
      - name: Publicar animacoes
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
